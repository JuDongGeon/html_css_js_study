<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품구매</title>
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <h1>제주 천혜향 농장</h1>
    <form>
      <label for="r">받는 분 성함</label>
      <input type="text" placeholder="예 : 안유진" id="r" />
      <label for="i">상품선택</label>
      <select id="i">
        <option>상품을 선택해주세요.</option>
        <option value="189000">소과: 18.900원</option>
        <option value="18900">대과: 18.900원</option>
      </select>

      <!-- label + input을 이용하여 주소 입력창쓰기 -->
      <label for="adr">배송지 입력</label>
      <input type="text" placeholder="예 : 대전 서구 탄방동" id="adr" />
      <div>
        <input type="submit" value="주문하기" />
        <input type="button" value="취소하기" />
        <input type="reset" value="초기화" />
      </div>
    </form>
    <script src="form.js"></script>
  </body>
</html>
